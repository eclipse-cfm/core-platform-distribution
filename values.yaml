# Default registry prepended to first-party component images whose `repo` has no host.
# Kept OUTSIDE `global` (so it only ever applies to first-party images): the infra
# images (postgres, vault, nats) are pinned to their full upstream refs below.
imageRegistry: ghcr.io

# =============================================================================
# Global settings shared across every component.
# =============================================================================
global:
  # Target namespace. Also used as the DNS namespace segment in in-cluster FQDNs.
  # Leave `createNamespace: false` and use `helm install --namespace <ns> --create-namespace`.
  namespace: edc-v
  createNamespace: false

  # Default imagePullPolicy for the first-party components. Each component below can
  # override it with its own `imagePullPolicy` (e.g. set the locally-built images to
  # Never/IfNotPresent on KinD while the rest keep pulling Always).
  imagePullPolicy: Always
  clusterDomain: svc.cluster.local

  # HTTPRoute hostname all application routes are exposed under.
  host: cpd.localhost
  gatewayName: edcv-gateway
  gatewayClassName: traefik

  # Externally reachable address of the Gateway, as seen by a COUNTERPARTY outside
  # the cluster. Governs the URLs this platform advertises about itself: the DSP
  # callback address, the DCP credential-service and issuance service endpoints,
  # and the did:web identifiers. The endpoints themselves are exposed via the
  # HTTPRoutes configured under `edc.*` below.
  #
  # !! IMPORTANT !! did:web identifiers are resolved by the connector runtimes as
  # well, i.e. from INSIDE the cluster, so `host` must resolve to the Gateway from
  # BOTH sides. On a plain KinD/Minikube cluster a `*.localhost` name resolves to
  # the pod's own loopback and DID resolution will fail — add a CoreDNS rewrite to
  # the Traefik service, or set `host` to a name that resolves correctly both ways
  # (see README, "External exposure").
  external:
    # "" => global.host
    host: ""
    # Port the Gateway is reachable on from outside. 80/443 are omitted from the
    # generated URLs and DIDs; anything else is appended (and percent-encoded in
    # did:web identifiers, e.g. did:web:example.com%3A8080:issuer).
    port: 80
    # Must agree with `edc.iam.did.web.use.https` in the component ConfigMaps.
    scheme: http

  # RFC 8693 subject-token wiring. The audience must match jwtlet's `client_audience`
  # (the Kubernetes cluster issuer).
  jwtSubjectTokenAudience: https://kubernetes.default.svc.cluster.local
  jwtSubjectTokenExpirationSeconds: 3600
  # jwtlet participant-token audience (client_audience / bound_audiences).
  tokenExchangeAudience: edcv

  # Master switch for the clearglass forward-auth middlewares on the API HTTPRoutes.
  # false => no route gets a jwt-auth middleware, regardless of the per-service
  # `authEnabled` flags. true => each service's own `authEnabled` decides.
  authEnabled: true

  # Emit JAVA_TOOL_OPTIONS with a JDWP agent (port 1044) for the JVM-based EDC apps.
  # Dev-only convenience — disable for production images.
  debug:
    enabled: true

# =============================================================================
# Infrastructure. Postgres, Vault and NATS are all in-chart manifests (see
# templates/infra-glue/), not community sub-charts. `connection.host: ""` means
# "derive <release>-<component>.<ns>.svc.<clusterDomain>" — the in-chart Services keep
# the <release>-postgresql / <release>-vault / <release>-nats names, so every consumer
# must resolve the host through the connection helpers, never a hardcoded name.
# =============================================================================
postgresql:
  enabled: true
  # Official postgres image (same family as the postgres-init hook). Pinned to a full
  # upstream ref so global.imageRegistry never rewrites it.
  image: postgres:17.7-alpine
  imagePullPolicy: IfNotPresent
  connection:
    host: ""
    port: 5432
    # Admin credentials used by the postgres-init hook to create the per-app DBs/users.
    adminUser: postgres
    # Secret (created by the in-chart postgresql template) holding the admin password.
    adminPasswordSecret:
      name: "" # "" => "<release>-postgresql"
      key: postgres-password
  # Bootstrap credentials for the in-chart server: the superuser password (stored in the
  # admin secret above) and the initial database created by the image on first start.
  auth:
    postgresPassword: postgres
    database: postgres
  # Data volume for the in-chart server. Dev default is an ephemeral emptyDir; enable
  # persistence (a PVC) for anything that must survive a pod restart.
  persistence:
    enabled: false
    size: 8Gi
    storageClass: "" # "" => cluster default StorageClass
  # Per-application databases/users created by the postgres-init hook.
  databases:
    - { db: controlplane, user: cp, password: cp }
    - { db: identityhub, user: ih, password: ih }
    - { db: issuerservice, user: issuer, password: issuer }
    # Consumed by the dataplane, which now ships in the jad-dataspace-profile chart;
    # postgres lives here so its database is still provisioned by this hook.
    - { db: dataplane, user: dp, password: dp }
    - { db: cfm, user: cfm, password: cfm }
    - { db: sigletdb, user: siglet, password: siglet }
    - { db: jwtlet, user: jwtlet, password: jwtlet }

vault:
  enabled: true
  # Official vault image, run in dev mode by the in-chart template. Pinned to a full
  # upstream ref so global.imageRegistry never rewrites it.
  image: hashicorp/vault:latest
  imagePullPolicy: IfNotPresent
  connection:
    host: ""
    port: 8200
    scheme: http
    rootToken: root # dev only; seeds the in-chart server's dev root token id

nats:
  enabled: true
  # NATS is deployed as an in-chart manifest (templates/infra-glue/nats.yaml) restored
  # verbatim from the original raw kustomize manifest, NOT as a community sub-chart. Its
  # jetstream tuning lives in the mounted nats.conf inside that template (store_dir,
  # max_memory_store 64MB, max_file_store 512MB, debug), matching the source exactly.
  image: nats:latest
  imagePullPolicy: IfNotPresent
  connection:
    # host "" => derive the in-chart service FQDN "nats.<ns>.svc.<clusterDomain>".
    host: ""
    port: 4222
    monitorPort: 8222
  # Component-level authentication via NKeys; see docs/nats-authentication.md.
  auth:
    # Renders the authorization include in nats.conf (users.conf is generated into
    # the <release>-nats-auth Secret by the nats-auth-bootstrap job), the per-pod
    # fetch-nats-nkey init containers, and the Vault policies/k8s-auth roles that
    # gate each identity's seed to the service accounts allowed to use it.
    enabled: true
    # THREE identities, one per permission profile, each shared by every workload with that
    # profile — rather than one NKey per component. Adding a workload is then a ServiceAccount
    # entry here instead of a new user + a new Vault role + a template edit. It is also the only
    # way a DOWNSTREAM chart can hold a NATS identity: it cannot add itself to this server's
    # users.conf, but it can reuse one of these by naming the matching role and seed path.
    #
    # Per entry the bootstrap jobs create: a seed at secret/nats/<name> (generated once, stable
    # across upgrades), a `nats-<name>` Vault policy + kubernetes-auth role bound to
    # `serviceAccounts`, and the users.conf entry carrying `publish` / `subscribe`.
    #
    # `serviceAccounts` is a LIST and Helm REPLACES lists rather than merging them, so a
    # downstream chart adding its own SA must restate the defaults alongside it.
    #
    # Trade-off of sharing: an identity grants the union of its members' needs — identityhub and
    # issuerservice can now also publish on the task subjects only the control plane uses. That is
    # acceptable between equally-trusted platform components on one broker; do NOT fold a
    # less-trusted workload into an identity just to save a role.
    users:
      # EDC and EDC-adjacent components: domain events on events.>, plus the negotiation and
      # transfer task subjects (cn-stream / tp-stream) used by the control plane's NATS task
      # publisher/subscriber extensions. Subscribing to events.> covers consumers of edc-events.
      edc-events:
        serviceAccounts:
          - controlplane
          - identityhub
          - issuerservice
        publish: [ "events.>", "negotiations.>", "transfers.>", "$JS.API.>", "$JS.ACK.>" ]
        subscribe: [ "events.>", "negotiations.>", "transfers.>", "_INBOX.>" ]
      # CFM agents and managers. cfm-stream carries "event.*" (natsclient CFMSubjectPrefix);
      # "events.>" on subscribe because kmagent consumes the edc-events stream.
      cfm-agents:
        serviceAccounts:
          - cfm-agents
        publish: [ "event.>", "$KV.cfm-bucket.>", "$JS.API.>", "$JS.ACK.>" ]
        subscribe: [ "event.>", "events.>", "$KV.cfm-bucket.>", "_INBOX.>" ]
      # Infrastructure only: the nats-bootstrap job that creates the streams.
      nats-admin:
        serviceAccounts:
          - seed-jobs
        publish: [ ">" ]
        subscribe: [ ">" ]
  # Data volume for JetStream (store_dir). Without persistence the store is an emptyDir, so
  # `storage: file` streams are NOT durable: every pod replacement (e.g. the roll triggered by
  # a users.conf change) wipes all streams and durable consumers, and only the nats-bootstrap
  # job (re-run on install/upgrade of THIS release) recreates the streams. With persistence
  # enabled the file-backed streams and consumers survive restarts and no component needs to
  # reconnect-from-scratch or restart.
  persistence:
    enabled: true
    size: 1Gi
    storageClass: "" # "" => cluster default StorageClass
  # Streams force-created by the nats-bootstrap job: an existing stream is dropped
  # and recreated from this definition on every install/upgrade, so a stream that a
  # consumer auto-created with narrower subjects never survives (see
  # docs/nats-authentication.md, Troubleshooting).
  streams:
    - name: edc-events
      subjects: "events.>"
      storage: file
      retention: interest
    - name: cn-stream
      subjects: "negotiations.>"
      storage: file
      retention: interest
    - name: tp-stream
      subjects: "transfers.>"
      storage: file
      retention: interest
# =============================================================================
# Telemetry (observability stack). Deployed as in-chart templates (self-contained
# single-replica Deployments) named exactly as the telemetry-config endpoints below
# expect: jaeger / prometheus / loki / grafana. This keeps the OTLP wiring simple and
# matches the config; swap for the upstream community charts later if desired.
# =============================================================================
telemetry:
  # The telemetry-config ConfigMap is envFrom'd by nearly every app; keep it on even
  # if you disable the backends (exports will just no-op/fail softly).
  configMapEnabled: true
  imagePullPolicy: IfNotPresent
  # Endpoints baked into the telemetry-config ConfigMap. The service names are the
  # in-cluster Service names; hosts are rendered through cpd.fqdn at template time.
  endpoints:
    tracesService: jaeger
    tracesPort: 4318
    metricsService: prometheus
    metricsPort: 9090
    metricsPath: /api/v1/otlp/v1/metrics
    logsService: loki
    logsPort: 3100
    logsPath: /otlp/v1/logs
  propagators: "tracecontext,baggage"

  jaeger:
    enabled: true
    image: jaegertracing/all-in-one:1.62.0 # 1.62.0: latest has UI theming issues
    host: jaeger.localhost
  prometheus:
    enabled: true
    image: prom/prometheus:v3.2.1
    host: prometheus.localhost
  loki:
    enabled: true
    image: grafana/loki:3.4.2
    host: loki.localhost
  grafana:
    enabled: true
    image: grafana/grafana:11.6.1
    host: grafana.localhost

# =============================================================================
# Security & gateway.
# =============================================================================
security:
  gateway:
    enabled: true
  gatewayClass:
    # Cluster-scoped singleton keyed to the Traefik controller. Disable on clusters
    # that already provide the `traefik` GatewayClass.
    enabled: true
  clearglass:
    enabled: true
    image:
      repo: eclipse-cfm/clearglass
      tag: 0.0.1
    replicas: 1
    # imagePullPolicy overrides global.imagePullPolicy for this component (empty = use global)
    imagePullPolicy: ""
    resources: {}
    # Static route→scope map evaluated by clearglass against X-Forwarded-Method /
    # X-Forwarded-Uri on every /validate call. Rules are first-match-wins, so keep
    # them most-specific-first; `anyOf` names the NARROWEST sufficient scope — wider
    # tokens (api-level, `<api>:*:<action>`, higher action) pass via implication
    # (admin ⊇ write ⊇ read). `*` = one segment, `**` (final only) = remainder.
    #
    # IMPORTANT: Traefik executes the forward-auth middleware AFTER the HTTPRoute
    # URLRewrite, so X-Forwarded-Uri carries the REWRITTEN backend path (verified
    # from report-only logs): /api/mgmt/v5/..., /api/identity/v1/...,
    # /api/admin/v1/..., /api/v1alpha1/... (tenant + provision manager share
    # this prefix and are disambiguated by resource name), and siglet paths with
    # the /api/siglet prefix stripped entirely (e.g. /tokens/...).
    routeMap:
      # false = report-only: violations are only logged ("report-only: ... would be
      # denied"), the legacy per-middleware ?scope= checks still decide. Flip to true
      # only after a clean soak (phase 3).
      enforce: true
      # applies when no rule matches: deny | allow
      default: deny
      # dataspace-profile-specific rules, evaluated BEFORE `rules` (first match wins)
      extraRules: []
      rules:
        # --- IdentityHub Identity API (backend /api/identity/v1/...) ---
        - path: /api/identity/*/participants/*/dids/**
          methods: [GET]
          anyOf: [identity-api:dids:read]
        - path: /api/identity/*/participants/*/dids/**
          methods: [POST, PUT, DELETE]
          anyOf: [identity-api:dids:write]
        - path: /api/identity/*/participants/*/keypairs/**
          methods: [GET]
          anyOf: [identity-api:keypairs:read]
        - path: /api/identity/*/participants/*/keypairs/**
          methods: [POST, PUT, DELETE]
          anyOf: [identity-api:keypairs:write]
        - path: /api/identity/*/participants/*/credentials/**
          methods: [GET]
          anyOf: [identity-api:credentials:read]
        - path: /api/identity/*/participants/*/credentials/**
          methods: [POST, PUT, DELETE]
          anyOf: [identity-api:credentials:write]
        - path: /api/identity/*/participants/**
          methods: [GET]
          anyOf: [identity-api:participants:read]
        - path: /api/identity/*/participants/**
          methods: [POST, PUT, DELETE]
          anyOf: [identity-api:participants:write]
        - path: /api/identity/*/dids/**
          methods: [GET, POST]
          anyOf: [identity-api:dids:read]
        # fallback for unmapped identity-api paths (narrow tokens will NOT pass here —
        # report-only logs reveal which paths need dedicated rules)
        - path: /api/identity/**
          methods: [GET]
          anyOf: [identity-api:read]
        - path: /api/identity/**
          anyOf: [identity-api:write]

        # --- Control plane Management API (backend /api/mgmt/v5/...) ---
        # participant context lifecycle & config are admin operations
        - path: /api/mgmt/*/participants
          methods: [POST]
          anyOf: [management-api:admin]
        - path: /api/mgmt/*/participants/*
          methods: [DELETE]
          anyOf: [management-api:admin]
        - path: /api/mgmt/*/participants/*/config
          methods: [PATCH, PUT]
          anyOf: [management-api:admin]
        # catalog is read-only (POST .../catalog/request and .../catalog/dataset/request are queries)
        - path: /api/mgmt/*/participants/*/catalog/**
          methods: [GET, POST]
          anyOf: [management-api:catalog:read]
        # EDC query convention: POST /<resource>/request is a READ
        - path: /api/mgmt/*/participants/*/assets/request
          methods: [POST]
          anyOf: [management-api:assets:read]
        - path: /api/mgmt/*/participants/*/assets/**
          methods: [GET]
          anyOf: [management-api:assets:read]
        - path: /api/mgmt/*/participants/*/assets/**
          methods: [POST, PUT, DELETE]
          anyOf: [management-api:assets:write]
        - path: /api/mgmt/*/participants/*/policydefinitions/request
          methods: [POST]
          anyOf: [management-api:policies:read]
        - path: /api/mgmt/*/participants/*/policydefinitions/**
          methods: [GET]
          anyOf: [management-api:policies:read]
        - path: /api/mgmt/*/participants/*/policydefinitions/**
          methods: [POST, PUT, DELETE]
          anyOf: [management-api:policies:write]
        - path: /api/mgmt/*/participants/*/contractdefinitions/request
          methods: [POST]
          anyOf: [management-api:contractdefinitions:read]
        - path: /api/mgmt/*/participants/*/contractdefinitions/**
          methods: [GET]
          anyOf: [management-api:contractdefinitions:read]
        - path: /api/mgmt/*/participants/*/contractdefinitions/**
          methods: [POST, PUT, DELETE]
          anyOf: [management-api:contractdefinitions:write]
        - path: /api/mgmt/*/participants/*/contractnegotiations/request
          methods: [POST]
          anyOf: [management-api:negotiations:read]
        - path: /api/mgmt/*/participants/*/contractnegotiations/**
          methods: [GET]
          anyOf: [management-api:negotiations:read]
        - path: /api/mgmt/*/participants/*/contractnegotiations/**
          methods: [POST]
          anyOf: [management-api:negotiations:write]
        - path: /api/mgmt/*/participants/*/contractagreements/**
          methods: [GET, POST]
          anyOf: [management-api:agreements:read]
        - path: /api/mgmt/*/participants/*/transferprocesses/request
          methods: [POST]
          anyOf: [management-api:transfers:read]
        - path: /api/mgmt/*/participants/*/transferprocesses/**
          methods: [GET]
          anyOf: [management-api:transfers:read]
        - path: /api/mgmt/*/participants/*/transferprocesses/**
          methods: [POST]
          anyOf: [management-api:transfers:write]
        - path: /api/mgmt/*/participants/*/dataplanes/**
          methods: [GET]
          anyOf: [management-api:read]
        - path: /api/mgmt/*/participants/*/dataplanes/**
          methods: [POST, PUT, DELETE]
          anyOf: [management-api:dataplanes:write]
        # fallback for unmapped management-api paths (celexpressions, discovery,
        # profiles, ... — refine from report-only logs)
        - path: /api/mgmt/**
          methods: [GET]
          anyOf: [management-api:read]
        - path: /api/mgmt/**
          anyOf: [management-api:write]

        # --- IssuerService Issuer Admin API (backend /api/admin/v1/...) ---
        - path: /api/admin/*/participants/*/holders/**
          methods: [GET]
          anyOf: [issuer-admin-api:holders:read]
        - path: /api/admin/*/participants/*/holders/**
          methods: [POST, PUT, DELETE]
          anyOf: [issuer-admin-api:holders:write]
        - path: /api/admin/*/participants/*/credentials/query
          methods: [POST]
          anyOf: [issuer-admin-api:credentials:read]
        - path: /api/admin/*/participants/*/credentials/**
          methods: [GET]
          anyOf: [issuer-admin-api:credentials:read]
        - path: /api/admin/*/participants/*/credentials/**
          methods: [POST, PUT, DELETE]
          anyOf: [issuer-admin-api:credentials:write]
        - path: /api/admin/*/participants/*/attestations/**
          methods: [GET]
          anyOf: [issuer-admin-api:attestations:read]
        - path: /api/admin/*/participants/*/attestations/**
          methods: [POST, PUT, DELETE]
          anyOf: [issuer-admin-api:attestations:write]
        - path: /api/admin/*/participants/*/credentialdefinitions/**
          methods: [GET]
          anyOf: [issuer-admin-api:credentialdefinitions:read]
        - path: /api/admin/*/participants/*/credentialdefinitions/**
          methods: [POST, PUT, DELETE]
          anyOf: [issuer-admin-api:credentialdefinitions:write]
        - path: /api/admin/*/participants/*/issuanceprocesses/**
          methods: [GET, POST]
          anyOf: [issuer-admin-api:issuanceprocesses:read]
        # fallback for unmapped issuer-admin-api paths
        - path: /api/admin/**
          methods: [GET]
          anyOf: [issuer-admin-api:read]
        - path: /api/admin/**
          anyOf: [issuer-admin-api:write]

        # --- CFM Tenant Manager + Provision Manager (both rewrite to /api/v1alpha1;
        # disambiguated by resource name; POST .../query endpoints are READs) ---
        # Tenant Manager: tenants, cells, dataspace-profiles, participant-profiles
        - path: /api/v1alpha1/tenants/query
          methods: [POST]
          anyOf: [tenant-manager-api:read]
        - path: /api/v1alpha1/tenants/*/participant-profiles/**
          methods: [GET]
          anyOf: [tenant-manager-api:read]
        - path: /api/v1alpha1/tenants/*/participant-profiles/**
          methods: [POST, PATCH, DELETE]
          anyOf: [tenant-manager-api:write]
        - path: /api/v1alpha1/tenants/**
          methods: [GET]
          anyOf: [tenant-manager-api:read]
        - path: /api/v1alpha1/tenants/**
          methods: [POST, PATCH, DELETE]
          anyOf: [tenant-manager-api:write]
        - path: /api/v1alpha1/cells/**
          methods: [GET]
          anyOf: [tenant-manager-api:read]
        - path: /api/v1alpha1/cells/**
          methods: [POST, PATCH, DELETE]
          anyOf: [tenant-manager-api:write]
        - path: /api/v1alpha1/dataspace-profiles/**
          methods: [GET]
          anyOf: [tenant-manager-api:read]
        - path: /api/v1alpha1/dataspace-profiles/**
          methods: [POST, PATCH, DELETE]
          anyOf: [tenant-manager-api:write]
        - path: /api/v1alpha1/participant-profiles/query
          methods: [POST]
          anyOf: [tenant-manager-api:read]
        - path: /api/v1alpha1/participant-profiles/**
          methods: [GET]
          anyOf: [tenant-manager-api:read]
        - path: /api/v1alpha1/participant-profiles/**
          methods: [POST, PATCH, DELETE]
          anyOf: [tenant-manager-api:write]
        # Provision Manager: activity-definitions, orchestration-definitions, orchestrations
        - path: /api/v1alpha1/orchestrations/query
          methods: [POST]
          anyOf: [provision-manager-api:read]
        - path: /api/v1alpha1/orchestrations/**
          methods: [GET]
          anyOf: [provision-manager-api:read]
        - path: /api/v1alpha1/orchestrations/**
          methods: [POST, DELETE]
          anyOf: [provision-manager-api:write]
        - path: /api/v1alpha1/activity-definitions/**
          methods: [GET]
          anyOf: [provision-manager-api:read]
        - path: /api/v1alpha1/activity-definitions/**
          methods: [POST, DELETE]
          anyOf: [provision-manager-api:write]
        - path: /api/v1alpha1/orchestration-definitions/**
          methods: [GET]
          anyOf: [provision-manager-api:read]
        - path: /api/v1alpha1/orchestration-definitions/**
          methods: [POST, DELETE]
          anyOf: [provision-manager-api:write]

        # --- Siglet (backend prefix stripped: /api/siglet/... -> /...; middleware
        # historically required siglet-api:read while enforcement and jwtlet seeding
        # use siglet-mgmt-api — accept both until the naming is unified) ---
        - path: /tokens/**
          methods: [GET]
          anyOf: [siglet-mgmt-api:read, siglet-api:read]
        - path: /key-mappings/**
          methods: [GET]
          anyOf: [siglet-mgmt-api:read, siglet-api:read]
        - path: /key-mappings/**
          methods: [POST, PUT, DELETE]
          anyOf: [siglet-mgmt-api:write, siglet-api:write]
  jwtlet:
    enabled: true
    image:
      repo: eclipse-cfm/jwtlet
      tag: 0.0.1
    vaultAgentImage: hashicorp/vault:latest
    replicas: 1
    # imagePullPolicy overrides global.imagePullPolicy for this component (empty = use global)
    imagePullPolicy: ""
    resources: {}

# =============================================================================
# EDC application components.
# =============================================================================
edc:
  controlplane:
    enabled: true
    # Attach the clearglass forward-auth middleware (jwt-auth) to this
    # service's HTTPRoute. Set false to expose the API without token validation. Auth is
    # also skipped chart-wide when global.authEnabled or security.clearglass.enabled
    # is false — global off wins over any per-service setting.
    authEnabled: true
    image:
      repo: eclipse-cfm/platform-images/controlplane
      tag: 0.0.1-rc.3
    replicas: 1
    # imagePullPolicy overrides global.imagePullPolicy for this component (empty = use global)
    imagePullPolicy: ""
    resources: {}
    # Additional trusted issuers registered in the controlplane, in addition to the
    # built-in issuerservice DID (edc.iam.trusted-issuer.issuer.id). Each entry is
    # rendered as edc.iam.trusted-issuer.<name>.id. The name is the EDC alias — it must
    # be unique and must not reuse the reserved `issuer` alias. Empty by default.
    #   trustedIssuers:
    #     - name: partner
    #       id: "did:web:partner.example.com:issuer"
    trustedIssuers: []
    # Dataspace protocol profiles advertised by the control plane.
    dataspaceProfiles:
      # Renders edc.dataspace.enable.profiles.all. When true, every protocol
      # profile the runtime knows about is enabled. Off by default — enable
      # only when the deployment genuinely needs to advertise all of them.
      enableAll: false
    # DSP protocol API (web.http.protocol, container port 8082).
    #
    # Deliberately exposed WITHOUT the clearglass forward-auth middleware: DSP
    # requests carry their own DCP credentials and the control plane validates them
    # in-app. Putting jwt-auth in front would reject every counterparty request,
    # since counterparties do not hold jwtlet-issued tokens.
    protocol:
      exposed: true
      # Passed through to the backend unrewritten, so it MUST equal
      # `web.http.protocol.path` in the controlplane ConfigMap. Also the base of the
      # advertised `edc.dsp.callback.address`.
      path: /api/dsp
  identityhub:
    enabled: true
    # Clearglass forward-auth (jwt-auth) on the HTTPRoute; see edc.controlplane.authEnabled.
    authEnabled: true
    configMapName: ih-config
    # DCP Credential Service (web.http.credentials, container port 7082). Exposed
    # without jwt-auth — the presentation endpoint authenticates the caller in-app
    # against its self-issued token. See edc.controlplane.protocol.
    credentials:
      exposed: true
      # Unrewritten; MUST equal `web.http.credentials.path` in the ih ConfigMap.
      path: /api/credentials
    # did:web document endpoint (web.http.did, container port 7083).
    #
    # Served on a DEDICATED hostname with its own HTTPRoute, matching "/" and
    # forwarding unrewritten. IdentityHub derives the DID from the request URL
    # (authority + path) and looks it up by exact match, so a dedicated host keeps
    # the DID's path segments free for the participant context id alone:
    #     did:web:<host>:<participantContextId>
    #       <-> GET http://<host>/<participantContextId>/did.json
    # Participant DIDs are minted outside this chart (ih-agent / participant
    # profiles); `helm status` prints the exact prefix to build them from.
    # DID documents are public by design, so no jwt-auth here either.
    did:
      exposed: true
      # "" => "identity.<global.external.host or global.host>". Must resolve to the
      # Gateway from inside the cluster as well as outside.
      host: ""
    image:
      repo: eclipse-cfm/platform-images/identity-hub
      tag: 0.0.1-rc.3
    replicas: 1
    # imagePullPolicy overrides global.imagePullPolicy for this component (empty = use global)
    imagePullPolicy: ""
    resources: {}
    # Scope mappings rendered into the ih-config ConfigMap as
    # edc.identityhub.scope.<name>.{pattern,leftoperand,operator,rightoperand} keys.
    # Empty by default; override (typically in an extension) to add scopes, e.g.:
    #   scopes:
    #     - name: membership
    #       pattern: "org\.eclipse\.custom\.vc\.type:(.+):(read|\*|all)"
    #       leftOperand: "verifiableCredential.credential.type"
    #       operator: "contains"
    #       rightOperand: "$1"
    scopes: []
  issuerservice:
    enabled: true
    # Clearglass forward-auth (jwt-auth) on the HTTPRoute; see edc.controlplane.authEnabled.
    authEnabled: true
    image:
      # there is a published issuerservice image in eclipse-cfm/platform-images, but it does NOT contain all the specific
      # code we need for our credentials here. Therefore, we build our own image in JAD
      repo: eclipse-cfm/platform-images/issuerservice
      tag: 0.0.1-rc.3
    replicas: 1
    # imagePullPolicy overrides global.imagePullPolicy for this component (empty = use global)
    imagePullPolicy: ""
    resources: {}
    # DCP issuance API (web.http.issuance, container port 10012). Exposed without
    # jwt-auth — holders authenticate with their own DCP token, validated in-app.
    issuance:
      exposed: true
      # Unrewritten; MUST equal `web.http.issuance.path` in the issuerservice
      # ConfigMap. Also the base of the IssuerService serviceEndpoint published in
      # the issuer's DID document by the issuerservice-seed job.
      path: /api/issuance
    # did:web document endpoint (web.http.did, container port 10016). Dedicated
    # hostname, matching "/" unrewritten, for the same reason as
    # edc.identityhub.did. The issuer DID is derived from it, with the issuer's
    # participantContextId as the final segment: did:web:<host>:issuer
    did:
      exposed: true
      # "" => "issuer.<global.external.host or global.host>". Must resolve to the
      # Gateway from inside the cluster as well as outside.
      #
      # This is the normal knob: the hostname is the constrained end (DNS, gateway,
      # certificates), and the issuer DID is generated to match it, so the DID and the
      # HTTPRoute serving it can never disagree. Mutually exclusive with `id` below.
      host: ""
      # Escape hatch: the issuer's DID, verbatim, overriding the derivation from `host`.
      # Use when the DID is not ours to choose — assigned by a dataspace registry, or one
      # that must stay stable while the infrastructure under it moves (credentials already
      # issued reference it, and changing it orphans them).
      #
      # This inverts the direction: per the did:web spec the DID dictates the URL, so the
      # HTTPRoute hostname is parsed back out of the DID rather than configured separately
      # — setting both `id` and `host` is an error. Path segments after the authority are
      # free; they only decide where the document is served (did:web:h:a:b -> /a/b/did.json)
      # and need not relate to the participant context id, since IssuerService looks the
      # document up by the DID it reconstructs from the request, not by context.
      #   id: "did:web:issuer.example.com:issuer"
      #   id: "did:web:issuer.example.com%3A8080:issuer"   # non-default gateway port
      #   id: "did:web:registry.example.org:issuers:acme"  # -> /issuers/acme/did.json
      id: ""
  siglet:
    enabled: true
    # Clearglass forward-auth (jwt-auth) on the HTTPRoute; see edc.controlplane.authEnabled.
    authEnabled: true
    # Siglet's token API ([token_api_auth] in siglet.toml). When enabled, the token
    # API validates participant tokens against jwtlet's JWKS using the same
    # jwks_url/audience as [signaling_auth]. Disabled renders mode = "disabled".
    tokenApiAuth:
      enabled: true
      # Grants admin access to the token API to callers presenting this scope.
      # Emitted as admin_scope inside [token_api_auth]; only meaningful when
      # tokenApiAuth.enabled is true. jwtlet seeds the matching
      # `siglet-token:admin` -> `siglet-token-api:admin` mapping.
      adminScope:
        enabled: false
        value: siglet-token-api:admin
    image:
      repo: eclipse-dataplane-core/dsdk-facet-rs/siglet
      tag: 0.1.3
    replicas: 1
    # imagePullPolicy overrides global.imagePullPolicy for this component (empty = use global)
    imagePullPolicy: ""
    resources: {}
    # Transfer types written into siglet.toml as [[transfer_types]] blocks.
    # Override this list to change/add transfer profiles per deployment.
    transferTypes:
      - transferType: "https://w3id.org/dspace-sig/profile/http-pull"
        endpointType: "https://w3id.org/dspace-sig/profile/http-pull"
        endpoint: "http://provider:8080/data"
        tokenSource: "provider"
        txRenewalSupport: false

# =============================================================================
# CFM application components.
# =============================================================================
cfm:
  agents:
    # Single deployment, six containers each with their own config mounted at /etc/appname.
    enabled: true
    containers:
      jwtletAgent:
        image: { repo: eclipse-cfm/cfm/jwtletagent, tag: 0.0.4 }
      edcvAgent:
        image: { repo: eclipse-cfm/cfm/edcvagent, tag: 0.0.4 }
      ihAgent:
        image: { repo: eclipse-cfm/cfm/ihagent, tag: 0.0.4 }
      registrationAgent:
        image: { repo: eclipse-cfm/cfm/regagent, tag: 0.0.4 }
      onboardingAgent:
        image: { repo: eclipse-cfm/cfm/obagent, tag: 0.0.4 }
      sigletAgent:
        image: { repo: eclipse-cfm/cfm/sigletagent, tag: 0.0.4 }
    replicas: 1
    # imagePullPolicy overrides global.imagePullPolicy for this component (empty = use global)
    imagePullPolicy: ""
    resources: {}
    # jwtlet agent application config.
    jwtlet:
      # Workload ServiceAccounts that get a participant-scoped resource mapping in jwtlet, and the
      # scopes each one is granted. Rendered into jwtlet-agent-config as a single-line JSON
      # `clientmappings` key.
      #
      # Empty by default, which makes the agent use its built-in list:
      #   controlplane -> [read, signaling]  (read = Vault partition, signaling = DPS with the data plane)
      #   identityhub  -> [read]
      #   siglet-sa    -> [read]
      #
      # A non-empty list REPLACES that built-in list entirely — it does not merge — so restate every
      # workload you still need, not just the one you are changing. `name` is the bare ServiceAccount
      # name; the agent prefixes it with `system:serviceaccount:<namespace>:`.
      #   clientMappings:
      #     - name: controlplane
      #       scopes: [ read, signaling ]
      #     - name: identityhub
      #       scopes: [ read ]
      clientMappings: []
  lifecycleAgents:
    # keymanagement agent
    enabled: true
    image:
      repo: eclipse-cfm/cfm/keymanagementagent
      tag: 0.0.4
    replicas: 1
    # imagePullPolicy overrides global.imagePullPolicy for this component (empty = use global)
    imagePullPolicy: ""
    resources: {}
  provisionManager:
    enabled: true
    # Clearglass forward-auth (jwt-auth) on the HTTPRoute; see edc.controlplane.authEnabled.
    authEnabled: true
    configMapName: pm-config
    image:
      repo: eclipse-cfm/cfm/pmanager
      tag: 0.0.4
    replicas: 1
    # imagePullPolicy overrides global.imagePullPolicy for this component (empty = use global)
    imagePullPolicy: ""
    resources: {}
  tenantManager:
    enabled: true
    # Clearglass forward-auth (jwt-auth) on the HTTPRoute; see edc.controlplane.authEnabled.
    authEnabled: true
    configMapName: tm-config
    image:
      repo: eclipse-cfm/cfm/tmanager
      tag: 0.0.4
    replicas: 1
    # imagePullPolicy overrides global.imagePullPolicy for this component (empty = use global)
    imagePullPolicy: ""
    resources: {}

# =============================================================================
# The app seed jobs run as Helm post-install/post-upgrade hooks; the bootstrap jobs
# (postgres/nats/vault/siglet) are plain, release-owned Jobs that run concurrently
# with the workloads (see templates/hooks/).
# =============================================================================
seedJobs:
  # Delete-policy for the seed-job HOOKS. Hook resources are NOT tracked by the
  # release, so without `hook-succeeded` they would linger after `helm uninstall`.
  #   before-hook-creation : remove a prior run before re-running (idempotent upgrades)
  #   hook-succeeded       : remove after a successful run (so nothing survives uninstall)
  # Failed hooks are intentionally kept (no `hook-failed`) so their logs can be inspected.
  hookDeletePolicy: before-hook-creation,hook-succeeded
  # Kubernetes-native garbage collection for the seed Jobs, independent of Helm's hook
  # lifecycle. Guarantees finished seed jobs are removed even when a helm install/upgrade
  # is interrupted or times out before it can run the hook-succeeded cleanup. Also long
  # enough (default 10m) to inspect a failed job's logs before the cluster reaps it.
  ttlSecondsAfterFinished: 600
  # Images used by the hook jobs.
  images:
    postgres: postgres:17.7-alpine
    natsBox: natsio/nats-box:latest
    vault: hashicorp/vault:latest
    curl: curlimages/curl:latest
  vaultBootstrap:
    enabled: true
  natsBootstrap:
    enabled: true
  # Generates the per-component NKey seeds (Vault) and the users.conf Secret
  # consumed by the NATS server; only effective when nats.auth.enabled.
  natsAuthBootstrap:
    enabled: true
  jwtletSeed:
    enabled: true
  # Creates the JWTlet mapping siglet needs to exchange its SA token at startup. A plain
  # Job, not a hook: it must run concurrently with the siglet Deployment (see the job).
  sigletSeed:
    enabled: true
  issuerserviceSeed:
    enabled: true
  provisionManagerSeed:
    enabled: true
  tenantManagerSeed:
    enabled: true
