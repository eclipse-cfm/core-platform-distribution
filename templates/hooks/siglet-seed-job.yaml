## This seed job creates the JWTlet mapping entry for "system:serviceaccount:<namespace>:siglet-sa",
## which siglet needs in order to exchange its service-account token for a participant token.

{{- if and .Values.edc.siglet.enabled .Values.security.jwtlet.enabled .Values.seedJobs.sigletSeed.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  # Plain Job (NOT a Helm hook): siglet mints its Vault token at startup by exchanging its
  # SA token at jwtlet, and exits(1) if that 403s. The mapping must therefore be created
  # CONCURRENTLY with the siglet Deployment -- as a post-install hook this would only run
  # once `helm install --wait` had already given up on siglet. The revision suffix lets
  # `helm upgrade` re-run it (Job specs are immutable).
  #
  # This deliberately lives outside jwtlet-seed, which stays a post-install hook: the
  # entries it creates are consumed by the app seed hooks (weight 20) rather than by a
  # workload's startup path, so it does not need to run concurrently.
  name: siglet-seed-r{{ .Release.Revision }}
  namespace: {{ include "cpd.namespace" . }}
  labels:
    app: siglet-seed
    platform: edcv
    type: edcv-job
    {{- include "cpd.labels" . | nindent 4 }}
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: {{ .Values.seedJobs.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app: siglet-seed
        platform: edcv
        type: edcv-job
    spec:
      serviceAccountName: seed-jobs
      restartPolicy: OnFailure

      initContainers:
        - name: wait-for-jwtlet
          image: {{ .Values.seedJobs.images.curl }}
          command:
            - sh
            - -c
            - |
              until curl -sf http://{{ include "cpd.fqdn" (dict "svc" "jwtlet" "ctx" $) }}:8080/health; do
                echo "Waiting for jwtlet to be ready..."
                sleep 5
              done
              echo ""
              echo "JWTlet is ready!"
      containers:
        - name: seed-siglet
          image: {{ .Values.seedJobs.images.curl }}
          env:
            - name: JWTLET_MGMT_URL
              value: "http://{{ include "cpd.fqdn" (dict "svc" "jwtlet" "ctx" $) }}:8081/api/v1"
          volumeMounts:
            {{- include "cpd.jwtletSubjectTokenMount" . | nindent 12 }}
          command:
            - sh
            - -c
            - |
              set -e

              # Executes a curl request and stores the response body in RESP_BODY and status code in RESP_STATUS.
              do_curl() {
                RESP=$(curl -s -w "\n%{http_code}" "$@")
                RESP_STATUS=$(printf '%s\n' "$RESP" | tail -1)
                RESP_BODY=$(printf '%s\n' "$RESP" | sed '$d')
              }

              # Read the projected service account token used to authenticate against the jwtlet management API.
              TOKEN=$(cat /var/run/secrets/jwtlet/token)
              if [ -z "$TOKEN" ]; then
                echo "ERROR: subject token at /var/run/secrets/jwtlet/token is empty"
                exit 1
              fi

              echo "================================================"
              echo "Create mapping entry for Siglet SA"
              echo "================================================"

              # participantContext "siglet" becomes the `sub` of the exchanged token, which Vault's
              # jwt auth method maps to the entity alias used by the participants-restricted policy.
              # It must match siglet's own participant context (SIGLET_PC_ID).
              do_curl -X POST "${JWTLET_MGMT_URL}/mappings" \
                -H "Authorization: Bearer ${TOKEN}" \
                -H "Content-Type: application/json" \
                -d '{
                    "clientIdentifier": "system:serviceaccount:{{ include "cpd.namespace" . }}:siglet-sa",
                    "participantContext": "siglet",
                    "scopes": ["read"],
                    "audiences": ["{{ .Values.global.tokenExchangeAudience }}"]
                }'
              if [ "$RESP_STATUS" -eq 409 ]; then
                echo "✓ siglet mapping entry already exists"
              elif [ "$RESP_STATUS" -ge 400 ]; then
                echo "ERROR: Failed to create siglet mapping entry (HTTP $RESP_STATUS): $RESP_BODY"
                exit 1
              else
                echo "✓ siglet mapping entry created"
              fi

              echo ""
              echo "================================================"
              echo "✓✓ Siglet seeding completed!"
              echo "================================================"
      volumes:
        # RFC 8693 subject_token used to authenticate against the jwtlet
        # management API. Audience must match jwtlet's `client_audience`.
        {{- include "cpd.jwtletSubjectTokenVolume" . | nindent 8 }}
{{- end }}
