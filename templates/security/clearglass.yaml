{{- if .Values.security.clearglass.enabled }}
{{- $c := .Values.security.clearglass }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cpd.workloadName" (dict "name" "clearglass" "ctx" $) }}
  namespace: {{ include "cpd.namespace" . }}
  labels:
    app: clearglass
    platform: edcv
    type: edcv-infra
    {{- include "cpd.labels" . | nindent 4 }}
spec:
  replicas: {{ $c.replicas }}
  selector:
    matchLabels:
      app: clearglass
  template:
    metadata:
      labels:
        app: clearglass
        platform: edcv
        type: edcv-infra
      annotations:
        # roll the pods when the route map changes
        checksum/routes: {{ include (print $.Template.BasePath "/security/clearglass-routes.yaml") . | sha256sum }}
    spec:
      containers:
        - name: clearglass
          image: {{ include "cpd.image" (dict "img" $c.image "ctx" $) }}
          imagePullPolicy: {{ include "cpd.pullPolicy" (dict "policy" $c.imagePullPolicy "ctx" $) }}
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: JWKS_URL
              value: {{ printf "http://%s:8080/.well-known/jwks.json" (include "cpd.fqdn" (dict "svc" "jwtlet" "ctx" $)) }}
            - name: ROUTES_FILE
              value: /etc/clearglass/routes.yaml
            - name: ENFORCE_ROUTES
              value: {{ $c.routeMap.enforce | quote }}
          volumeMounts:
            - name: routes
              mountPath: /etc/clearglass
              readOnly: true
          {{- with $c.probes.liveness }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $c.probes.readiness }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $c.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: routes
          configMap:
            name: clearglass-routes
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: clearglass
  namespace: {{ include "cpd.namespace" . }}
  labels:
    tier: infrastructure
    {{- include "cpd.labels" . | nindent 4 }}
spec:
  selector:
    app: clearglass
  ports:
    - port: 8080
      targetPort: 8080
      name: http
{{- end }}
