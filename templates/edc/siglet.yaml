{{- if .Values.edc.siglet.enabled }}
{{- $c := .Values.edc.siglet }}
{{- $jwtlet := printf "http://%s:8080" (include "cpd.fqdn" (dict "svc" "jwtlet" "ctx" $)) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: siglet
  namespace: {{ include "cpd.namespace" . }}
  labels:
    app: siglet
    {{- include "cpd.labels" . | nindent 4 }}
spec:
  replicas: {{ $c.replicas }}
  selector:
    matchLabels:
      app: siglet
  template:
    metadata:
      labels:
        app: siglet
    spec:
      serviceAccountName: siglet-sa
      initContainers:
        # siglet mints its Vault token at startup: an RFC 8693 exchange at jwtlet, then a
        # Vault jwt login with `siglet-role`. It exits(1) on the first failure with no retry,
        # and both prerequisites are created by plain Jobs that run CONCURRENTLY with this
        # Deployment -- siglet-seed (the jwtlet mapping) and vault-bootstrap (siglet-role plus
        # auth/jwt/config, which it writes as its very last step). Block here until the whole
        # chain works so the pod never crash-loops.
        - name: wait-for-vault-auth
          image: {{ .Values.seedJobs.images.curl }}
          command: [ "sh", "-c" ]
          args:
            - |
              VAULT_URL="{{ include "cpd.vaultUrl" . }}"
              JWTLET_TOKEN_URL="http://{{ include "cpd.fqdn" (dict "svc" "jwtlet" "ctx" $) }}:8080/token"
              until TOKEN=$(curl -sf -X POST "$JWTLET_TOKEN_URL" \
                      -H "Content-Type: application/x-www-form-urlencoded" \
                      --data-urlencode "grant_type=urn:ietf:params:oauth:grant-type:token-exchange" \
                      --data-urlencode "subject_token=$(cat /var/run/secrets/jwtlet/token)" \
                      --data-urlencode "subject_token_type=urn:ietf:params:oauth:token-type:jwt" \
                      --data-urlencode "resource=siglet" \
                      --data-urlencode "scope=read" \
                      --data-urlencode "audience={{ .Values.global.tokenExchangeAudience }}" \
                      | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p') && [ -n "$TOKEN" ] \
                 && printf '{"jwt":"%s","role":"siglet-role"}' "$TOKEN" \
                      | curl -sf -o /dev/null -X POST "$VAULT_URL/v1/auth/jwt/login" --data-binary @-; do
                echo "Waiting for the siglet Vault auth chain (jwtlet mapping, Vault jwt role)..."
                sleep 5
              done
              echo "Siglet Vault auth chain is ready"
          volumeMounts:
            {{- include "cpd.jwtletSubjectTokenMount" . | nindent 12 }}
      volumes:
        - name: siglet-config
          configMap:
            name: siglet-config
        # RFC 8693 subject_token exchanged at jwtlet for the participant token used to
        # log into Vault. Audience must match jwtlet's `client_audience`.
        {{- include "cpd.jwtletSubjectTokenVolume" . | nindent 8 }}
      containers:
        - name: siglet
          image: {{ include "cpd.image" (dict "img" $c.image "ctx" $) }}
          imagePullPolicy: {{ include "cpd.pullPolicy" (dict "policy" $c.imagePullPolicy "ctx" $) }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: signaling
              containerPort: 8081
              protocol: TCP
            - name: refresh
              containerPort: 8082
              protocol: TCP
            - name: management
              containerPort: 8083
              protocol: TCP
          env:
            - name: RUST_LOG
              value: "info,siglet=debug"
            - name: SIGLET__SIGLET_API_PORT
              value: "8080"
            - name: SIGLET__SIGNALING_PORT
              value: "8081"
            - name: SIGLET__REFRESH_API_PORT
              value: "8082"
            - name: SIGLET_CONFIG_FILE
              value: "/config/siglet.toml"
            - name: SIGLET__VAULT__URL
              value: {{ include "cpd.vaultUrl" . | quote }}
            - name: SIGLET__VAULT__SIGNING_KEY_NAME
              value: "signing-siglet"
            - name: SIGLET__VAULT__MOUNT_PATH
              value: "participants"
            - name: SIGLET__VAULT__TOKEN_SUBPATH
              value: "siglet/client-tokens"
            - name: SIGLET__VAULT__USE_HTTP_RESOLUTION
              value: "true"
            - name: SIGLET__VAULT__AUTH__TYPE
              value: "token_exchange"
            - name: SIGLET__VAULT__AUTH__EXCHANGE_URL
              value: {{ $jwtlet | quote }}
            # Projected token with an explicit audience matching jwtlet's `client_audience`;
            # the default SA token only carries that audience when the cluster's
            # --api-audiences happens to match. Re-read on every token acquisition, so
            # kubelet rotation is safe.
            - name: SIGLET__VAULT__AUTH__SUBJECT_TOKEN_FILE
              value: "/var/run/secrets/jwtlet/token"
            - name: SIGLET__VAULT__AUTH__AUDIENCE
              value: {{ .Values.global.tokenExchangeAudience | quote }}
            - name: SIGLET__VAULT__AUTH__SCOPE
              value: "read"
            - name: SIGLET__VAULT__AUTH__ROLE
              value: "siglet-role"
            - name: SIGLET__TOKEN__ISSUER
              value: "siglet-issuer"
            - name: SIGLET__TOKEN__REFRESH_ENDPOINT
              value: {{ printf "http://%s:8082/token" (include "cpd.fqdn" (dict "svc" "siglet" "ctx" $)) | quote }}
          volumeMounts:
            - name: siglet-config
              mountPath: /config
              readOnly: true
            {{- include "cpd.jwtletSubjectTokenMount" . | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: siglet
  namespace: {{ include "cpd.namespace" . }}
  labels:
    app: siglet
    {{- include "cpd.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: signaling
      port: 8081
      targetPort: signaling
      protocol: TCP
    - name: refresh
      port: 8082
      targetPort: refresh
      protocol: TCP
    - name: management
      port: 8083
      targetPort: management
      protocol: TCP
  selector:
    app: siglet
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: siglet
  namespace: {{ include "cpd.namespace" . }}
  labels:
    {{- include "cpd.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.global.gatewayName }}
      kind: Gateway
      sectionName: http
  hostnames:
    - {{ .Values.global.host }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/siglet
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
{{- if and .Values.global.authEnabled .Values.security.clearglass.enabled .Values.edc.siglet.authEnabled }}
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: jwt-auth
{{- end }}
      backendRefs:
        - name: siglet
          port: 8080
          weight: 1
{{- end }}
